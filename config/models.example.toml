# Copy to fleet.models.toml or pass --model-config config/models.example.toml.
# Set the selected environment variable separately. Keep credentials out of TOML.
default_profile = "local-qwen"

[profiles.local-qwen]
provider = "openai-compatible"
base_url = "http://127.0.0.1:18478/v1"
model = "qwen3-4b-q4km"
api_key_env = "RAYDA_LOCAL_API_KEY"
timeout_seconds = 45

[profiles.openai]
provider = "openai-compatible"
model = "gpt-4.1-mini"
api_key_env = "OPENAI_API_KEY"

[profiles.deepseek]
provider = "openai-compatible"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
deepseek_thinking = "disabled"
max_output_tokens = 768

[profiles.mimo-api]
provider = "openai-compatible"
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.6-flash"
api_key_env = "MIMO_API_KEY"

[profiles.anthropic]
provider = "anthropic"
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"

[profiles.gemini]
provider = "google_genai"
model = "gemini-flash-latest"
api_key_env = "GOOGLE_API_KEY"
